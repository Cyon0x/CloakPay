[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "shanghai"
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read", path = "../tests/fixtures" },
  { access = "read", path = "../circuits/build" },
]

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
elysium_testnet = "https://testnet-rpc.elysium.kinetiq.xyz"
